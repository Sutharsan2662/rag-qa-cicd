name: CI - Build and Test Docker Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-ci:
    name: Build & Smoke Test Container
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository code
        uses: actions/checkout@v7

      - name: 2. Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 3. Build Docker image (with GitHub Actions cache)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: rag-qa-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 4. Smoke test container startup & /health endpoint
        run: |
          docker run -d --name rag-ci-test -p 8000:8000 \
            -e OPENAI_API_KEY=sk-ci-dummy-key \
            -e QDRANT_URL=https://example.qdrant.io \
            -e QDRANT_API_KEY=ci-dummy-key \
            rag-qa-app:ci

          echo "Waiting for FastAPI to start..."
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8000/health; then
              echo ""
              echo "Health check passed!"
              exit 0
            fi
            sleep 2
          done

          echo "Health check failed! Container logs:"
          docker logs rag-ci-test
          exit 1

      - name: 5. Clean up test container
        if: always()
        run: docker rm -f rag-ci-test || true